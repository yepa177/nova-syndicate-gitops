---
# Inventaire nova-syndicate — kubeadm (noms k3s-* historiques)
# k3s-worker-node-2 = nœud 10.0.4.2 (Zabbix / monitoring)
all:
  vars:
    ansible_user: user
    ansible_become: true
    ansible_python_interpreter: /usr/bin/python3
  children:
    k8s_nodes:
      children:
        control_plane:
        workers:
    control_plane:
      hosts:
        k3s-lyon-01:
          ansible_host: 10.0.1.2
          ansible_connection: local
    workers:
      hosts:
        k3s-worker-mrs:
          ansible_host: 10.1.1.2
        k3s-worker-node-2:
          ansible_host: 10.0.4.2
