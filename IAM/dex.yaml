apiVersion: v1
kind: Namespace
metadata:
  name: identity
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex
  namespace: identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin   # Lab uniquement – à restreindre en prod
subjects:
- kind: ServiceAccount
  name: dex
  namespace: identity
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: identity
data:
  config.yaml: |
    issuer: https://dex.identity.svc.cluster.local:5556/dex

    storage:
      type: memory

    web:
      http: 0.0.0.0:5556

    connectors:
    - type: ldap
      id: ldap
      name: OpenLDAP Assurance
      config:
        host: openldap.identity.svc.cluster.local:389
        insecureNoSSL: true
        insecureSkipVerify: true
        bindDN: cn=admin,dc=assurance,dc=local
        bindPW: ComplexP@ssw0rd2026!
        userSearch:
          baseDN: ou=users,dc=assurance,dc=local
          filter: "(objectClass=inetOrgPerson)"
          username: uid
          idAttr: uid
          emailAttr: uid
          nameAttr: cn
        groupSearch:
          baseDN: ou=groups,dc=assurance,dc=local
          filter: "(objectClass=groupOfNames)"
          userMatchers:
          - userAttr: DN
            groupAttr: member
          nameAttr: cn

    staticClients:
    - id: kubernetes
      redirectURIs:
      - http://127.0.0.1:8000
      - http://localhost:8000
      name: Kubernetes
      secret: kubernetes-secret-lab-2026

    oauth2:
      skipApprovalScreen: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      serviceAccountName: dex
      containers:
      - name: dex
        image: ghcr.io/dexidp/dex:v2.41.1
        command: ["dex", "serve", "/etc/dex/config.yaml"]
        ports:
        - containerPort: 5556
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/dex
      volumes:
      - name: config
        configMap:
          name: dex-config
          items:
          - key: config.yaml
            path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: identity
spec:
  selector:
    app: dex
  ports:
  - name: http
    port: 5556
    targetPort: 5556
