apiVersion: v1
kind: Secret
metadata:
  name: openldap-secret
  namespace: identity
type: Opaque
stringData:
  LDAP_ADMIN_PASSWORD: "ComplexP@ssw0rd2026!"
  LDAP_CONFIG_PASSWORD: "ConfigP@ssw0rd2026!"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap-pvc
  namespace: identity
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap-config-pvc
  namespace: identity
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
      - name: openldap
        image: osixia/openldap:1.5.0
        ports:
        - containerPort: 389
          name: ldap
        - containerPort: 636
          name: ldaps
        env:
        - name: LDAP_ORGANISATION
          value: "Assurance Demo"
        - name: LDAP_DOMAIN
          value: "assurance.local"
        - name: LDAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-secret
              key: LDAP_ADMIN_PASSWORD
        - name: LDAP_CONFIG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openldap-secret
              key: LDAP_CONFIG_PASSWORD
        - name: LDAP_TLS
          value: "false"
        volumeMounts:
        - name: data
          mountPath: /var/lib/ldap
        - name: config
          mountPath: /etc/ldap/slapd.d
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: openldap-pvc
      - name: config
        persistentVolumeClaim:
          claimName: openldap-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: identity
spec:
  selector:
    app: openldap
  ports:
  - name: ldap
    port: 389
    targetPort: 389
  - name: ldaps
    port: 636
    targetPort: 636
