apiVersion: batch/v1
kind: Job
metadata:
  name: vault-unseal
  namespace: vault
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: unseal
        image: hashicorp/vault:2.0.3
        command:
        - /bin/sh
        - -c
        - |
          set -e
          export VAULT_ADDR=http://vault.vault.svc:8200

          echo "Attente de Vault..."
          until vault status >/dev/null 2>&1; do
            sleep 2
          done

          if vault status 2>/dev/null | grep -q "Sealed.*false"; then
            echo "Vault déjà unsealed"
            exit 0
          fi

          echo "Unseal en cours..."
          vault operator unseal "$KEY1"
          vault operator unseal "$KEY2"
          vault operator unseal "$KEY3"

          echo "Unseal terminé"
          vault status
        env:
        - name: KEY1
          valueFrom:
            secretKeyRef:
              name: vault-unseal-keys
              key: key1
        - name: KEY2
          valueFrom:
            secretKeyRef:
              name: vault-unseal-keys
              key: key2
        - name: KEY3
          valueFrom:
            secretKeyRef:
              name: vault-unseal-keys
              key: key3
