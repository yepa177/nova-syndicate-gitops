apiVersion: batch/v1
kind: Job
metadata:
  name: vault-unseal
  namespace: vault
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: unseal
        image: hashicorp/vault:2.0.3
        command:
        - /bin/sh
        - -c
        - |
          set -e
          export VAULT_ADDR=http://vault.vault.svc:8200

          echo "Attente que Vault soit joignable..."
          # On attend que l'API réponde (même si sealed)
          until vault status 2>&1 | grep -q "Initialized"; do
            sleep 2
          done

          echo "Vault est joignable"

          if vault status 2>&1 | grep -q "Sealed.*false"; then
            echo "Vault est déjà unsealed"
            exit 0
          fi

          echo "Vault est sealed → unseal en cours..."
          vault operator unseal "$KEY1"
          vault operator unseal "$KEY2"
          vault operator unseal "$KEY3"

          echo "Unseal terminé"
          vault status
        env:
        - name: KEY1
          valueFrom:
            secretKeyRef:
              name: vault-unseal-keys
              key: key1
        - name: KEY2
          valueFrom:
            secretKeyRef:
              name: vault-unseal-keys
              key: key2
        - name: KEY3
          valueFrom:
            secretKeyRef:
              name: vault-unseal-keys
              key: key3
