grafana:
  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 3Gi
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.nova-syndicate.local
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  nodeSelector:  # Ajouté
    kubernetes.io/hostname: k3s-worker-mrs

prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 5Gi
    nodeSelector:
      kubernetes.io/hostname: k3s-worker-mrs  # Changé
    resources:
      requests:
        cpu: 400m
        memory: 1Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    nodeSelector:  # Ajouté si alertmanager est activé
      kubernetes.io/hostname: k3s-worker-mrs