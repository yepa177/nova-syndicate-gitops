apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova-syndicate-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:yepa177/nova-syndicate-gitops.git
    targetRevision: main
    path: manifests/overlays/lab        # ← TOUT LE LAB
    directory:
      recurse: true                     # ← C’EST LA LIGNE MAGIQUE
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
