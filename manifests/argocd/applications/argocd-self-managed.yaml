apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 7.7.0
    helm:
      values: |
        global:
          nodeSelector:
            kubernetes.io/hostname: k3s-lyon-01   # Préférence globale si possible
        controller:
          nodeSelector: {}
          tolerations: []  
        server:
          nodeSelector: {}
          tolerations: []
          extraArgs:
            - --insecure
          service:
            selector:
              app.kubernetes.io/instance: argocd
              app.kubernetes.io/name: argocd-server
        repoServer:
          nodeSelector: {}
          tolerations: []
        dex:
          nodeSelector: {}
          tolerations: []
        redis:
          nodeSelector: {}
          tolerations: []   
        notifications:
          nodeSelector: {}
          tolerations: []  
        applicationSet:
          nodeSelector: {}
          tolerations: []
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true