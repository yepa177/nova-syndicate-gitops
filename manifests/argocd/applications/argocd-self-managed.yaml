apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 7.7.0
    helm:
      values: |
        global:
          nodeSelector:
            kubernetes.io/hostname: k3s-lyon-01
          tolerations:
            - key: dedicated
              operator: Equal
              value: monitoring
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        controller:
          nodeSelector:
            kubernetes.io/hostname: k3s-lyon-01
          tolerations:
            - key: dedicated
              operator: Equal
              value: monitoring
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        server:
          nodeSelector:
            kubernetes.io/hostname: k3s-lyon-01
          tolerations:
            - key: dedicated
              operator: Equal
              value: monitoring
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          extraArgs:
            - --insecure
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - argocd.local
            paths:
              - /
            pathType: Prefix  
          service:
            selector:
              app.kubernetes.io/instance: argocd
              app.kubernetes.io/name: argocd-server
        repoServer:
          # nodeSelector supprimé → peut aller sur n’importe quel nœud  
          tolerations:
            - key: dedicated
              operator: Equal
              value: monitoring
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 3Gi
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
            - name: helm-working-dir
              emptyDir:
                sizeLimit: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: helm-working-dir
              mountPath: /helm-working-dir
        dex:
          # nodeSelector supprimé
          tolerations:
            - key: dedicated
              operator: Equal
              value: monitoring
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        redis:
          nodeSelector:
            kubernetes.io/hostname: k3s-lyon-01
          tolerations:
            - key: dedicated
              operator: Equal
              value: monitoring
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        notifications:
          nodeSelector:
            kubernetes.io/hostname: k3s-lyon-01
          tolerations:
            - key: dedicated
              operator: Equal
              value: monitoring
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        applicationSet:
          nodeSelector:
            kubernetes.io/hostname: k3s-lyon-01
          tolerations:
            - key: dedicated
              operator: Equal
              value: monitoring
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true