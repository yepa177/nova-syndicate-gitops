# manifests/overlays/lab/postgresql/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-ha
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql-ha
    targetRevision: 13.2.2
    helm:
      releaseName: postgresql-ha
      valuesObject:
        pgpool:
          enabled: true                     # ← DÉSACTIVE PGPOOL
        postgresql:
          replicaCount: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 800m
              memory: 2Gi
          persistence:
            enabled: true
            storageClass: longhorn
            size: 10Gi
        patroni:
          scope: nova-lab
          postgresql:
            parameters:
              max_connections: 100
              shared_buffers: 256MB
              wal_buffers: 16MB
              synchronous_commit: remote_write
              synchronous_standby_names: '1'
          nodeSelector:
            kubernetes.io/hostname: k3s-lyon-01
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: postgresql-ha
                  topologyKey: kubernetes.io/hostname
  destination:
    server: https://kubernetes.default.svc
    namespace: nova-syndicate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
