# manifests/argocd/applications/postgresql-ha.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-ha
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql-ha
    targetRevision: 14.1.1
    helm:
      releaseName: postgresql-ha
      values:
        # Configuration PGPool - votre solution : replicaCount: 0
        pgpool:
          replicaCount: 0  # ← VOTRE CORRECTION : pas de pods PGPool
          image:
            registry: public.ecr.aws
            repository: bitnami/pgpool
            tag: 4.6.3-debian-12-r0
        
        # Configuration PostgreSQL avec images ECR
        postgresql:
          enabled: true
          replicaCount: 3  # Conserver 3 pour HA
          image:
            registry: public.ecr.aws
            repository: bitnami/postgresql-repmgr
            tag: 17.6.0-debian-12-r2  # Version plus récente disponible
        
        # Désactiver Patroni (chart utilise Repmgr)
        patroni:
          enabled: false
        
        # Activer Repmgr (déjà activé par défaut dans ce chart)
        repmgr:
          enabled: true
        
        # Authentification
        global:
          postgresql:
            auth:
              postgresPassword: "postgres-password-123"
              replicationPassword: "replication-password-123"
              repmgrPassword: "repmgr-password-123"
        
        # Stockage Longhorn
        persistence:
          storageClass: "longhorn"
        
        # Désactiver les permissions de volume
        volumePermissions:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: nova-syndicate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
