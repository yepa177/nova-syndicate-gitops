apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yepa177/nova-syndicate-gitops.git
    targetRevision: main
    path: manifests/base/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true