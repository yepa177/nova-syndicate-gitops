apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yepa177/nova-syndicate-gitops.git   # ← Votre repo Git
    targetRevision: main
    path: manifests/base/monitoring                               # ← Chemin vers le dossier contenant values-prometheus.yaml
    helm:
      valueFiles:
        - values-prometheus.yaml
      chart: kube-prometheus-stack
      repoURL: https://prometheus-community.github.io/helm-charts
      version: "87.2.1"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true