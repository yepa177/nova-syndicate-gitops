apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zabbix
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://zabbix-community.github.io/helm-zabbix
    targetRevision: 7.0.12  # Version stable et récente
    chart: zabbix  # Nom correct du chart
    helm:
      values: |
        # Configuration pour Zabbix Server
        zabbix-server:
          enabled: true
          nodeSelector:
            kubernetes.io/hostname: zabbix-monitoring
          resources:
            requests:
              cpu: 300m
              memory: 512Mi

        # Configuration pour Zabbix Web (interface)
        zabbix-web:
          enabled: true
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - zabbix.local

        # Configuration pour Zabbix Proxy (optionnel)
        zabbix-proxy:
          enabled: false  # Désactivé pour simplifier le déploiement

        # Configuration pour PostgreSQL (base de données)
        postgresql:
          enabled: true
          persistence:
            storageClass: "longhorn"
            size: 3Gi

        # Configuration pour le stockage persistant
        persistence:
          enabled: true
          storageClass: "longhorn"
          size: 3Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: zabbix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true