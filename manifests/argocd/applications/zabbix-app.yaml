apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova-zabbix
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yepa177/nova-syndicate-gitops.git  # Ton dépôt Git
    targetRevision: main
    path: manifests/overlays/lab/zabbix  # Chemin vers l'overlay Kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: zabbix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true