apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova-zabbix
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:yepa177/nova-syndicate-gitops.git
    targetRevision: main
    path: manifests/base/zabbix
    helm:
      valueFiles:
        - values-zabbix.yaml
      chart: zabbix
      repoURL: https://zabbix.github.io/helm-charts
  destination:
    server: https://kubernetes.default.svc
    namespace: zabbix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
