apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova-zabbix
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://zabbix.github.io/helm-charts
    chart: zabbix
    targetRevision: "2.6.0"          # Vérifiez la dernière version stable
    helm:
      valueFiles:
        - values-zabbix.yaml
      parameters: []                 # Vous pouvez ajouter des overrides ici si besoin
  destination:
    server: https://kubernetes.default.svc
    namespace: zabbix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: "ConfigMap"
      name: ".*"
      jqPathExpressions:
        - ".data"