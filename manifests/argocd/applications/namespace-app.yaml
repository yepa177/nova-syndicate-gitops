apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova-namespace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:yepa177/nova-syndicate-gitops.git
    targetRevision: main
    path: manifests/overlays/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true