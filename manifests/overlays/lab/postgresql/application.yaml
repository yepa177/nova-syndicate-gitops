# manifests/overlays/lab/postgresql/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-ha
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql-ha
    targetRevision: 14.1.1
    helm:
      releaseName: postgresql-ha
      values: |
        # Configuration PGPool - DÉSACTIVER complètement
        pgpool:
          enabled: false
        
        # Configuration PostgreSQL avec Longhorn
        postgresql:
          enabled: true
          replicaCount: 2  # Commencer avec 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          persistence:
            enabled: true
            storageClass: "longhorn"
            size: 8Gi
            accessModes:
              - ReadWriteOnce
        
        # Désactiver Patroni (utiliser repmgr à la place)
        patroni:
          enabled: false
        
        # Activer repmgr (plus simple)
        repmgr:
          enabled: true
        
        # Authentification
        global:
          postgresql:
            auth:
              postgresPassword: "postgres-password-123"
              replicationPassword: "replication-password-123"
              repmgrPassword: "repmgr-password-123"
        
        # FORCER les images avec des tags spécifiques
        image:
          registry: docker.io
          repository: bitnami/postgresql-repmgr
          tag: 15.7.0-debian-12-r2  # Version PostgreSQL 15 plus stable
          pullPolicy: IfNotPresent
        
        # Désactiver les permissions de volume
        volumePermissions:
          enabled: false
        
        # Configuration supplémentaire
        initdbScripts:
          {}
        
        # Affinité pour répartir sur les nœuds
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: postgresql-ha
                topologyKey: kubernetes.io/hostname
  destination:
    server: https://kubernetes.default.svc
    namespace: nova-syndicate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
