# manifests/overlays/lab/postgresql/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-ha
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql-ha
    targetRevision: 14.1.1
    helm:
      releaseName: postgresql-ha
      values: |
        # Configuration PGPool - DÉSACTIVER temporairement pour debug
        pgpool:
          enabled: false
        
        # Configuration PostgreSQL avec Longhorn
        postgresql:
          enabled: true
          replicaCount: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          persistence:
            enabled: true
            storageClass: "longhorn"
            size: 8Gi
            accessModes:
              - ReadWriteOnce
        
        # Configuration Patroni simplifiée
        patroni:
          enabled: true
          scope: nova-lab
          postgresql:
            parameters:
              max_connections: 100
              shared_buffers: 128MB
              wal_buffers: 8MB
              synchronous_commit: remote_write
              synchronous_standby_names: '1'
        
        # Désactiver le nodeSelector restrictif - laisser Kubernetes décider
        # nodeSelector:
        #   kubernetes.io/hostname: k3s-lyon-01
        
        # Affinité pour répartir sur les nœuds
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: postgresql-ha
                topologyKey: kubernetes.io/hostname
        
        # Authentification ESSENTIELLE (manquante !)
        global:
          postgresql:
            auth:
              postgresPassword: "postgres-password-123"
              replicationPassword: "replication-password-123"
              repmgrPassword: "repmgr-password-123"
        
        # Images - spécifier explicitement pour éviter les conflits
        image:
          registry: docker.io
          repository: bitnami/postgresql-repmgr
          tag: 16.3.0-debian-12-r8
          pullPolicy: IfNotPresent
        
        # Désactiver les permissions de volume
        volumePermissions:
          enabled: false
        
        # Options supplémentaires
        initdbScripts:
          {}
        postgresql:
          sharedPreloadLibraries: "repmgr"
  destination:
    server: https://kubernetes.default.svc
    namespace: nova-syndicate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
