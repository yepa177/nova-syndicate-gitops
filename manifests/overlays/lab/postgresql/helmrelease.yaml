# manifests/overlays/lab/postgresql/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql-ha
  namespace: nova-syndicate
spec:
  interval: 5m
  chart:
    spec:
      chart: postgresql-ha
      version: 14.1.1
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: postgresql-values-lab
      valuesKey: values.yaml
