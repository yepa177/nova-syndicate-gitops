apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml

patchesJson6902:
  - target:
      kind: Deployment
      name: nginx-test
    patch: |
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: website
          configMap:
            name: nginx-website
            items:
              - key: index.html
                path: index.html
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: website
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
          readOnly: true
