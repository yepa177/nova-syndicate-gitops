# Configuration pour Prometheus
prometheus:
  prometheusSpec:
    # Stockage persistant avec Longhorn
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # Conservation des données pendant 30 jours
    retention: 7d
    # Sélecteur de nœud pour déployer sur zabbix-monitoring
    nodeSelector:
      kubernetes.io/hostname: zabbix-monitoring
    # Configuration pour accéder à Kubernetes
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# Configuration pour Grafana
grafana:
  # Stockage persistant avec Longhorn
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  # Mot de passe admin (à remplacer par un mot de passe sécurisé)
  adminPassword: "admin123"
  # Configuration Ingress pour accéder à Grafana
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.nova-syndicate.local
  # Configuration des sources de données
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-kube-prometheus-prometheus.monitoring:9090
          access: proxy
          isDefault: true

# Configuration pour AlertManager (optionnel)
alertmanager:
  enabled: true
  # Sélecteur de nœud
  nodeSelector:
    kubernetes.io/hostname: zabbix-monitoring

# Configuration pour Node Exporter
prometheus-node-exporter:
  # Sélecteur de nœud pour déployer sur tous les nœuds
  nodeSelector:
    kubernetes.io/arch: amd64